profile: smoke
allow_identical_splits: true
checkpoint:
  path: data/checkpoint/pet-omatpes-l-v0.1.0.ckpt
  expected_sha256: 879b1045391d88869522605a8b8b3cedeed74668e7062fdd7487548ab7b08004
data:
  train: &n20
    path: data/dataset/matpes_n20.extxyz
    expected_sha256: c92161329aab539064a2c2438a395cb01e38bfc91211c558aebbc1ff94702e3d
  validation: *n20
  test: *n20
readouts:
  energy_prediction: energy
  force_prediction: non_conservative_forces
  energy_features: mtt::aux::energy_last_layer_features
  force_features: mtt::aux::non_conservative_forces_last_layer_features
cache:
  batch_size: 2
binning:
  algorithm: fixed_linear_v1
  force_max_error: 0.5
  energy_max_error: 0.3
model:
  force:
    enabled: true
    target_mode: atom_mean
    hidden_dims: [16]
    dropout: 0.0
    num_bins: 50
  energy:
    enabled: true
    hidden_dims: [16]
    dropout: 0.0
    num_bins: 50
    cumulant_order: 3
    signed_root: true
loss:
  force_coefficient: 1.0
  energy_coefficient: 1.5
  label_smoothing: 0
  class_weights: null
optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
scheduler:
  name: reduce_lr_on_plateau
  monitor: val/total_loss_ema
  factor: 0.5
  patience: 5
  threshold: 0.0001
  threshold_mode: abs
  cooldown: 0
  min_lr: 0.000001
trainer:
  batch_size: 2
  num_workers: 0
  max_atoms_per_batch: null
  min_atoms_per_batch: 0
  pin_memory: false
  persistent_workers: false
  grad_clip_norm: 1.0
  max_epochs: 1
  ema_beta: 0.95
  early_stopping_patience: 1
  min_delta: 0.0001
  min_epochs: 1
  monitor: val/total_loss_ema
  resume_from: null
run:
  output_root: Uncertainty_Quantification/ConfidenceHead/outputs
  name_prefix: upet_n20_local_cpu
  seed: 1234
  device: cpu
  amp: false
logging:
  jsonl: true
  wandb: true
  wandb_mode: offline
  wandb_project: upet-confidence-head
  log_interval_steps: 1
